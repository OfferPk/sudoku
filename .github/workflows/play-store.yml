name: Play Store build

# On demand only (Actions tab > "Play Store build" > Run workflow).
# Injects the real AdMob IDs from repository secrets into a throw-away copy of the build tree
# (nothing is committed) and, with "release" checked, FAILS if any Google test ID or
# Play Games placeholder would ship. The normal "Android build" workflow is unchanged and
# keeps producing test-ID debug/test releases on every push and v* tag.
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release mode: fail on test/placeholder IDs and require signing secrets'
        type: boolean
        default: true
      cloud_save:
        description: 'Enable Play Games cloud save (needs PLAY_GAMES_APP_ID secret + native bridge, see SETUP_PLAY_GAMES.md)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: play-store-${{ github.ref }}
  cancel-in-progress: true

jobs:
  store-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Tests (run on the committed test-ID config)
        run: npm test

      - name: Inject store IDs from secrets
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          PLAY_GAMES_APP_ID: ${{ secrets.PLAY_GAMES_APP_ID }}
          CLOUD_SAVE: ${{ inputs.cloud_save }}
        run: node scripts/store-config.js inject

      - name: Guard - no test or placeholder IDs (sources)
        run: |
          if [ "$RELEASE" = "true" ]; then node scripts/store-config.js check
          else node scripts/store-config.js check || echo "::warning::Dry run (release=false): the problems above would fail a release build"; fi

      - name: Capacitor sync
        run: npx cap sync android

      - name: Guard - no test or placeholder IDs (synced app bundle)
        run: |
          if [ "$RELEASE" = "true" ]; then node scripts/store-config.js check
          else node scripts/store-config.js check || echo "::warning::Dry run (release=false)"; fi

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$RELEASE" = "true" ]; then echo "::error::KEYSTORE_BASE64 secret not set - a Play Store upload must be signed"; exit 1; fi
            echo "::warning::KEYSTORE_BASE64 not set - dry run builds UNSIGNED"; exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build release AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease

      - name: Collect AAB
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          SUFFIX=$([ "$RELEASE" = "true" ] && echo store || echo store-dryrun)
          mkdir -p dist
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/sudoku-v$VERSION-$SUFFIX.aab"
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then jarsigner -verify dist/*.aab | grep -E "jar verified|unsigned"; fi
          rm -f "$RUNNER_TEMP/upload.jks"
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: sudoku-play-store-aab
          path: dist/*.aab
          if-no-files-found: error
          retention-days: 14
